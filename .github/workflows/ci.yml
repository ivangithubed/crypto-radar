name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Повна історія потрібна verify-gate.py --ci, щоб знайти коміт етапу 6 (оракул).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Версію pnpm бере з packageManager у package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high

      - name: Verify (lint, format, tests, build, bundle size)
        run: pnpm verify

      # Оракул етапу 6 (приймальні тести US-1 – US-9): --ci нижче лише звіряє його цілісність, тут — запуск.
      - name: Acceptance oracle (stage 6)
        run: pnpm exec vitest run --config acceptance/vitest.config.js

      - name: Install Chromium for axe and Lighthouse
        run: pnpm exec playwright install --with-deps chromium

      - name: Measured tech debt (debt_commands)
        run: python .agentic/bundle/skills/gate-check/verify-gate.py --debt

      - name: SDD pipeline gates (approved stages, oracle integrity, secrets)
        run: python .agentic/bundle/skills/gate-check/verify-gate.py --ci
