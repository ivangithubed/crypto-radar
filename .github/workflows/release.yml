# Етап 9: реліз Крипто-Радара на GitHub Pages (ADR 0003).
# Ланцюг: збірка артефакту ОДИН раз (тег vX.Y.Z) → smoke того самого артефакту (vite preview) → деплой у production
# через захищене середовище `github-pages` (обов'язкове схвалення власника на боці GitHub) → перевірка production.
# Відкат і повторний деплой: workflow_dispatch з ІСНУЮЧИМ тегом попередньої версії (див. .agentic/specs/09-release-runbook.md).
name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Існуючий тег vX.Y.Z (повторний деплой або відкат на попередню версію)"
        required: true
        type: string

permissions:
  contents: read

# Один реліз за раз; запущений деплой не скасовуємо.
concurrency:
  group: release-pages
  cancel-in-progress: false

env:
  # Вхід (тег або параметр запуску) передається лише змінною середовища, не підстановкою в shell.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build artifact once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate tag is SemVer
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Тег '$RELEASE_TAG' не відповідає SemVer vX.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      # Версію pnpm бере з packageManager у package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high

      - name: Verify (lint, format, tests, build, bundle size)
        run: pnpm verify

      - name: Stamp artifact with version and commit
        run: |
          commit="$(git rev-parse HEAD)"
          printf '{"version":"%s","commit":"%s"}\n' "$RELEASE_TAG" "$commit" > dist/version.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  smoke:
    name: Smoke the same artifact (staging substitute)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install browsers for smoke
        run: pnpm exec playwright install --with-deps chromium webkit

      # Той самий артефакт, що піде в production, без перезбирання.
      - name: Download the built artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - name: Unpack artifact into dist
        run: |
          mkdir -p dist
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C dist
          test -f dist/index.html
          test -f dist/version.json
          cat dist/version.json

      - name: Serve the artifact with vite preview
        run: |
          nohup pnpm preview --port 4174 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:4174/crypto-radar/" > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/preview.log"
          exit 1

      # CI порожній, щоб Playwright (reuseExistingServer) не збирав застосунок наново, а взяв сервер вище.
      - name: Smoke suite (Chromium and WebKit)
        env:
          CI: ""
        run: pnpm exec playwright test -c e2e/playwright.config.js --grep @smoke --project=chromium --project=webkit

  deploy:
    name: Deploy to GitHub Pages (production, requires approval)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Захищене середовище: обов'язкове схвалення (required reviewers) налаштовує власник у Settings → Environments.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-production:
    name: Verify production after deploy
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://ivangithubed.github.io/crypto-radar
    steps:
      - name: Check page and version stamp
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "$SITE_URL/version.json" -o version.json && grep -q "\"version\":\"$RELEASE_TAG\"" version.json; then
              break
            fi
            sleep 6
          done
          cat version.json
          grep -q "\"version\":\"$RELEASE_TAG\"" version.json
          curl -fsS "$SITE_URL/" | grep -q "Крипто-Радар"
          echo "Production відповідає: $RELEASE_TAG"
